name: polymap
description: "PolyMap — navigation du campus de l'École Supérieure Polytechnique de Dakar."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  # Live camera backdrop for the AR screens. The spatial-anchoring engine
  # (ARCore / ARKit / marker-based) is deliberately NOT wired yet — see
  # docs/AR_APPROACH.md for the decision to be made.
  camera: ^0.11.0
  sensors_plus: ^7.1.0
  web: ^1.1.1
  # Real map with OpenStreetMap tiles
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # GPS tracking
  geolocator: ^13.0.1
  # Location marker on flutter_map
  flutter_map_location_marker: ^9.0.0
  # Routing via OpenRouteService
  open_route_service: ^1.2.9
  # HTTP for API calls
  http: ^1.2.1
  # QR code scanning for indoor positioning
  mobile_scanner: ^5.2.3
  # Local persistence for user preferences
  shared_preferences: ^2.3.3
  # Offline map tile caching
  flutter_map_tile_caching: ^10.0.0
  # Authentication backend
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

  # Section 03 — Typographie. Bundled so the app renders identically offline.
  # Space Grotesk and IBM Plex Sans are variable fonts: weight is driven by
  # FontVariation('wght', …) in lib/theme/pm_text.dart.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# App icons — `dart run flutter_launcher_icons` regenerates every platform
# from the masters in assets/icons (built from assets/images/logo_src.png).
flutter_launcher_icons:
  image_path: "assets/icons/icon.png"
  android: true
  adaptive_icon_background: "#F5F1EA"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/icon_monochrome.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#F5F1EA"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#F5F1EA"
    theme_color: "#1479C9"
