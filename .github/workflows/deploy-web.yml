# Deploy Web to GitHub Pages
# NOTE: GitHub Pages requires a paid plan (Pro/Team). Free plan does not support it.
# To enable this workflow, upgrade GitHub plan and configure pages.
# Until then, deployment is handled via Vercel (see ci-cd.yml).
name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  skip:
    runs-on: ubuntu-latest
    steps:
      - name: Skip GitHub Pages Deployment
        run: |
          echo "GitHub Pages deployment skipped — requires GitHub Pro/Team plan."
          echo "Web deployment is handled by Vercel (see ci-cd.yml)."
          echo "To enable: gh secret set VERCEL_TOKEN --repo=sambaseness/polymap-v2"
